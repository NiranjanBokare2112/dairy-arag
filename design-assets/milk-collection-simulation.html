<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>आरग दूध संकलन केंद्र – दूध संकलन simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:20px 12px;background:#F4F7FB}
.sim{font-family:'Mukta',sans-serif;color:#1A1A1A;background:#fff;border:1px solid #DCE5F1;border-radius:16px;overflow:hidden;max-width:1200px;margin:0 auto}
.sim-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 8px}
.sim-head h2{margin:0;font-size:22px;font-weight:800;color:#1F4E9A}
.sim-head p{margin:0;font-size:15px;color:#444}
.sim svg{display:block;width:100%;height:auto;font-family:'Mukta',sans-serif}
.sim-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px 6px}
.sim-ctl button,.sim-ctl select{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:0 14px;border:1.5px solid #1F4E9A;border-radius:8px;background:#fff;color:#1F4E9A;cursor:pointer}
.sim-ctl button.main{background:#1F4E9A;color:#fff}
.sim-ctl input[type=range]{flex:1 1 220px;accent-color:#1F4E9A;min-height:40px}
.sim-steps{list-style:none;margin:0;padding:6px 14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.sim-steps button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:15px;font-weight:600;padding:10px 12px;border:1.5px solid #C9D6E8;border-radius:10px;background:#fff;color:#1F4E9A;cursor:pointer;min-height:44px}
.sim-steps button.on{background:#1F4E9A;border-color:#1F4E9A;color:#fff}
.sim-steps button.done{border-color:#2E7D32;color:#1B5E20}
.sim-steps b{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:14px}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.s1{animation-duration:6.2s;animation-delay:-1.3s}.s2{animation-duration:4.4s;animation-delay:-2.1s}
@keyframes sway{0%,100%{transform:rotate(-0.8deg)}50%{transform:rotate(0.9deg)}}
.cloud{animation:drift 60s linear infinite}.cloud.c2{animation-duration:85s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
@media (prefers-reduced-motion: reduce){.sway,.cloud{animation:none}}
</style>
</head>
<body>
<!--
  Milk-collection simulation (SVG + plain JS, no libraries).
  - Everything on screen is a pure function of time: render(t). The loop advances t with requestAnimationFrame.
  - Arms, legs and the operator's arm use 2-bone inverse kinematics (ik()); the walk cycle is procedural.
  - Controls: play/pause, replay, speed, timeline scrubber, and step buttons that seek.
  - prefers-reduced-motion: shows the "message received" frame, paused.
  - All numbers are sample data. In the app, feed the real entry (code, litres, Fat, SNF, rate, amount) into SAMPLE.
-->
<section class="sim" id="sim">
<div class="sim-head">
<div><h2>दूध संकलन कसे होते?</h2><p>प्रत्येक थेंबाचा पारदर्शक हिशोब – लगेच तुमच्या मोबाईलवर.</p></div>
</div>

<script>
(function () {
  'use strict';
  var SAMPLE = { litre: 6.40, fat: 4.0, snf: 8.5 };
  var D = 23, GROUND = 440;
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };
  var ease = function (k) { k = clamp(k, 0, 1); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
  var seg = function (t, a, b) { return clamp((t - a) / (b - a), 0, 1); };
  var P = function (x, y) { return x.toFixed(1) + ' ' + y.toFixed(1); };
  var line = function (a, b) { return 'M' + P(a[0], a[1]) + ' L' + P(b[0], b[1]); };
  var rot = function (v, deg) { var r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; };

  // two-bone inverse kinematics: returns [elbow, hand]
  function ik(s, tg, a, b, sign) {
    var dx = tg[0] - s[0], dy = tg[1] - s[1], d0 = Math.hypot(dx, dy) || 1e-3;
    var d = clamp(d0, Math.abs(a - b) + 1e-3, a + b - 1e-3);
    var base = Math.atan2(dy, dx), A = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
    var ang = base + sign * A, e = [s[0] + a * Math.cos(ang), s[1] + a * Math.sin(ang)];
    var hx = tg[0] - e[0], hy = tg[1] - e[1], hl = Math.hypot(hx, hy) || 1e-3;
    return [e, [e[0] + hx / hl * b, e[1] + hy / hl * b]];
  }

  // ---------- story timeline (seconds) ----------
  function farmerX(t) {
    if (t < 6.0) return 646;
    if (t < 7.4) return lerp(646, 774, ease(seg(t, 6.0, 7.4)));
    if (t < 16.8) return 774;
    if (t < 17.8) return lerp(774, 646, ease(seg(t, 16.8, 17.8)));
    return 646;
  }
  // the farmer rides in, gets off, and rides away again
  function bikeX(t) {
    if (t < 4.4) { var k = seg(t, 0, 4.4); return lerp(-260, 626, 1 - Math.pow(1 - k, 2.2)); }
    if (t < 19.6) return 626;
    var q = seg(t, 19.6, 22.8); return lerp(626, 1480, Math.pow(q, 1.7));
  }
  function ridingAt(t) {
    if (t < 4.4) return 1;
    if (t < 5.0) return 1 - ease(seg(t, 4.4, 5.0));
    if (t < 19.0) return 0;
    if (t < 19.6) return ease(seg(t, 19.0, 19.6));
    return 1;
  }
  function facing(t) {
    if (t < 16.8) return 1;
    if (t < 17.9) return -1;
    if (t < 18.2) return lerp(-1, 1, ease(seg(t, 17.9, 18.2)));
    return 1;
  }

  function litresAt(t) { return SAMPLE.litre * (1 - Math.pow(1 - seg(t, 8.6, 11.0), 1.6)); }

  var legF = $('legF'), legB = $('legB');
  function drawLeg(g, hip, foot) {
    var r = ik(hip, foot, 52, 50, -1), knee = r[0], ank = r[1];
    var hem = [lerp(knee[0], ank[0], .45), lerp(knee[1], ank[1], .45)];
    g.querySelector('.thigh').setAttribute('d', line(hip, knee));
    g.querySelector('.hem').setAttribute('d', line(knee, hem));
    g.querySelector('.shin').setAttribute('d', line(knee, ank));
    g.querySelector('.foot').setAttribute('d', line([ank[0] - 3, ank[1] + 1], [ank[0] + 14, ank[1] + 2]));
  }
  function drawArm(prefix, sh, target, sign) {
    var r = ik(sh, target, 38, 38, sign), el = r[0], hd = r[1];
    $(prefix + 'U').setAttribute('d', line(sh, el));
    $(prefix + 'F').setAttribute('d', line(el, hd));
    $(prefix + 'C').setAttribute('d', line(el, [lerp(el[0], hd[0], .55), lerp(el[1], hd[1], .55)]));
    return hd;
  }

  function render(t) {
    t = clamp(t, 0, D);
    var fx = farmerX(t), bx = bikeX(t), face = facing(t), dir = face < 0 ? -1 : 1;
    var v = Math.abs(farmerX(t + .03) - farmerX(t - .03)) / .06;     // px per second
    var walk = clamp(v / 120, 0, 1), phase = fx * 0.055;
    var bob = -2.2 * walk * Math.abs(Math.cos(phase));
    var hip = [2, -100 + bob], sh = [2, -171 + bob];

    // legs (procedural walk cycle)
    var stride = 24 * walk;
    var footF = [stride * Math.sin(phase) + 4, -4 - Math.max(0, Math.cos(phase)) * 9 * walk];
    var footB = [stride * Math.sin(phase + Math.PI) - 4, -4 - Math.max(0, Math.cos(phase + Math.PI)) * 9 * walk];
    drawLeg(legF, hip, footF); drawLeg(legB, hip, footB);

    // --- hand targets (farmer local space) ---
    var swingF = [6 + 16 * Math.sin(phase + Math.PI) * walk, -100];
    var swingB = [-2 + 16 * Math.sin(phase) * walk, -100];
    var grip = [(bx + 60 - fx) * dir, -130], seat = [(bx - 28 - fx) * dir, -118];
    var carry = [24, -104], lift = [64, -144];
    var canRot = 0, canOnBike = true, tF, tB = swingB;

    if (t < 5.2) { tF = grip; tB = seat; }
    else if (t < 5.6) { tF = grip; tB = [lerp(seat[0], swingB[0], ease(seg(t, 5.2, 5.6))), lerp(seat[1], swingB[1], ease(seg(t, 5.2, 5.6)))]; }
    else if (t < 6.0) { var k1 = ease(seg(t, 5.6, 6.0)); tF = [lerp(grip[0] - 6, carry[0], k1), lerp(grip[1] + 2, carry[1], k1)]; canOnBike = false; }
    else if (t < 7.6) { tF = carry; canOnBike = false; }
    else if (t < 11.2) {
      canOnBike = false;
      var k2 = ease(seg(t, 7.6, 8.4));
      tF = [lerp(carry[0], lift[0], k2), lerp(carry[1], lift[1], k2)];
      canRot = 24 * k2 + 72 * ease(seg(t, 8.4, 8.8)) + 8 * seg(t, 8.8, 11.0);
    }
    else if (t < 11.8) { canOnBike = false; var k3 = ease(seg(t, 11.2, 11.8)); tF = [lerp(lift[0], carry[0], k3), lerp(lift[1], carry[1], k3)]; canRot = 104 * (1 - k3); }
    else if (t < 18.3) { canOnBike = false; tF = carry; }
    else if (t < 18.9) { canOnBike = false; var k4 = ease(seg(t, 18.3, 18.9)); tF = [lerp(carry[0], grip[0], k4), lerp(carry[1], grip[1], k4)]; tB = [lerp(swingB[0], seat[0], k4), lerp(swingB[1], seat[1], k4)]; if (k4 > .98) canOnBike = true; }
    else { tF = grip; tB = seat; }

    // supporting hand under the can while pouring
    if (t >= 8.2 && t < 11.6) {
      var sup = rot([0, 50], canRot), kk = ease(seg(t, 8.2, 8.6)) * (1 - ease(seg(t, 11.2, 11.6)));
      var hs = [tF[0] + sup[0], tF[1] + sup[1]];
      tB = [lerp(swingB[0], hs[0], kk), lerp(swingB[1], hs[1], kk)];
    }
    // checking the phone
    var phoneUp = 0;
    if (t >= 14.8 && t < 16.9) {
      var pk = t < 15.2 ? seg(t, 14.8, 15.2) * .5 : (t < 16.5 ? .5 + .5 * ease(seg(t, 15.2, 15.6)) : 1 - ease(seg(t, 16.5, 16.9)));
      var pocket = [8, -148], face2 = [34, -184];
      tB = pk <= .5 ? [lerp(swingB[0], pocket[0], pk * 2), lerp(swingB[1], pocket[1], pk * 2)]
                    : [lerp(pocket[0], face2[0], (pk - .5) * 2), lerp(pocket[1], face2[1], (pk - .5) * 2)];
      phoneUp = pk > .5 ? 1 : 0;
    }

    // ---- blend the standing pose with the riding pose (scene space) ----
    var r = ridingAt(t);
    var gx = lerp(fx, bx - 28, r), gy = lerp(GROUND, GROUND - 20, r);
    var S = function (p) { return [fx + dir * p[0], GROUND + p[1]]; };
    var Lc = function (P) { return [(P[0] - gx) * dir, P[1] - gy]; };
    var mix = function (a, b) { return [lerp(a[0], b[0], r), lerp(a[1], b[1], r)]; };
    var crankA = bx * 0.02, crank = [bx - 6, GROUND - 40];
    var pedF = [crank[0] + 15 * Math.cos(crankA), crank[1] + 15 * Math.sin(crankA) - 3];
    var pedB = [crank[0] + 15 * Math.cos(crankA + Math.PI), crank[1] + 15 * Math.sin(crankA + Math.PI) - 3];
    if (r > 0) {
      hip = Lc(mix(S(hip), [bx - 26, GROUND - 120]));
      footF = Lc(mix(S(footF), pedF)); footB = Lc(mix(S(footB), pedB));
      tF = Lc(mix(S(tF), [bx + 60, GROUND - 130])); tB = Lc(mix(S(tB), [bx + 52, GROUND - 128]));
      drawLeg(legF, hip, footF); drawLeg(legB, hip, footB);
    }
    var lean = 26 * r;
    sh = [hip[0] + rot([0, -71], lean)[0], hip[1] + rot([0, -71], lean)[1]];
    var upper = 'translate(' + (hip[0] - 2).toFixed(1) + ' ' + (hip[1] + 100).toFixed(1) + ') rotate(' + lean.toFixed(1) + ' 2 -100)';
    $('torso').setAttribute('transform', upper); $('head').setAttribute('transform', upper);
    $('crankArm').setAttribute('d', line([pedF[0] - bx, pedF[1] + 3 - GROUND], [pedB[0] - bx, pedB[1] + 3 - GROUND]));
    $('pedalF').setAttribute('transform', 'translate(' + (pedF[0] - bx).toFixed(1) + ' ' + (pedF[1] + 3 - GROUND).toFixed(1) + ')');
    $('pedalB').setAttribute('transform', 'translate(' + (pedB[0] - bx).toFixed(1) + ' ' + (pedB[1] + 3 - GROUND).toFixed(1) + ')');

    var hB = drawArm('fArmB', [sh[0] - 4, sh[1] + 2], tB, 1);
    var hF = drawArm('fArmF', sh, tF, 1);
    $('fHandF').setAttribute('cx', hF[0]); $('fHandF').setAttribute('cy', hF[1]);
    var ftf = 'translate(' + gx.toFixed(1) + ' ' + gy.toFixed(1) + ') scale(' + face.toFixed(3) + ' 1)';
    $('farmer').setAttribute('transform', ftf); $('farmerBack').setAttribute('transform', ftf);
    $('fShadow').setAttribute('opacity', (.16 * (1 - r)).toFixed(3));
    $('handPhone').setAttribute('opacity', phoneUp);
    $('handPhone').setAttribute('transform', 'translate(' + hB[0].toFixed(1) + ' ' + (hB[1] - 6).toFixed(1) + ') rotate(-12)');
    $('pocketPhone').setAttribute('opacity', phoneUp ? 0 : 1);
    var buzz = (t > 14.6 && t < 15.0) ? Math.sin(t * 90) * 1.5 : 0;
    $('pocketPhone').setAttribute('transform', 'translate(' + buzz.toFixed(2) + ' 0)');
    $('pocketGlow').setAttribute('opacity', (t > 14.6 && t < 15.0) ? 1 : 0);
    $('handGlow').setAttribute('opacity', t > 15.9 ? 1 : .35);

    $('fShadow').setAttribute('cx', (gx + 4).toFixed(1));
    $('bShadow').setAttribute('cx', bx.toFixed(1));
    // bicycle
    var wheelDeg = (bx / 44) * 180 / Math.PI;
    $('bike').setAttribute('transform', 'translate(' + bx.toFixed(1) + ' ' + GROUND + ')');
    $('wR').setAttribute('transform', 'rotate(' + wheelDeg.toFixed(1) + ' -64 -44)');
    $('wF').setAttribute('transform', 'rotate(' + wheelDeg.toFixed(1) + ' 64 -44)');
    $('kick').setAttribute('opacity', (t >= 4.6 && t < 19.4) ? 1 : 0);

    // can
    var cx, cy, cr = 0, csx = 1;
    if (canOnBike) { cx = bx + 54; cy = GROUND - 132; }
    else { cx = gx + face * hF[0]; cy = gy + hF[1]; cr = canRot * dir; csx = face; }
    $('can').setAttribute('transform', 'translate(' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ') rotate(' + cr.toFixed(1) + ') scale(' + csx.toFixed(3) + ' 1)');

    // pour stream + vessel + scale
    var pouring = t >= 8.6 && t < 11.2;
    if (pouring) {
      var mouth = rot([0, 18], canRot); var m = [cx + mouth[0], cy + mouth[1]];
      var d = 'M' + P(m[0], m[1]) + ' Q' + P(m[0] + 22, m[1] - 6) + ' ' + P(861, 318);
      $('stream').setAttribute('d', d); $('streamCore').setAttribute('d', d);
      $('stream').setAttribute('stroke-dashoffset', (-t * 120).toFixed(1));
    }
    var so = pouring ? Math.min(1, seg(t, 8.6, 8.8) * 5) * (1 - seg(t, 11.0, 11.2)) : 0;
    $('stream').setAttribute('opacity', so); $('streamCore').setAttribute('opacity', so);
    var L = t < 16.8 ? litresAt(t) : SAMPLE.litre * (1 - seg(t, 16.8, 17.4));
    var fill = L / SAMPLE.litre * 30;
    $('milk').setAttribute('y', (342 - fill).toFixed(1)); $('milk').setAttribute('height', fill.toFixed(1));
    $('milkTop').setAttribute('y', (342 - fill).toFixed(1)); $('milkTop').setAttribute('opacity', fill > 1 ? 1 : 0);
    $('scaleTxt').textContent = (t < 16.8 ? litresAt(t) : (t < 17.4 ? SAMPLE.litre : 0)).toFixed(2);

    // operator: dip sample → analyzer → rest
    var opSh = [918, 292], rest = [898, 344], vessel = [861, 316], slot = [990, 330], opT = rest;
    if (t >= 11.6 && t < 12.2) { var a1 = ease(seg(t, 11.6, 12.0)); opT = [lerp(rest[0], vessel[0], a1), lerp(rest[1], vessel[1], a1)]; }
    else if (t >= 12.2 && t < 12.6) { var a2 = ease(seg(t, 12.2, 12.6)); opT = [lerp(vessel[0], slot[0], a2), lerp(vessel[1], slot[1], a2)]; }
    else if (t >= 12.6 && t < 13.6) { opT = slot; }
    else if (t >= 13.6 && t < 14.0) { var a3 = ease(seg(t, 13.6, 14.0)); opT = [lerp(slot[0], rest[0], a3), lerp(slot[1], rest[1], a3)]; }
    var opA = ik(opSh, opT, 32, 32, 1), opB = ik(opSh, opT, 32, 32, -1);
    var op = opA[0][1] >= opB[0][1] ? opA : opB;            // keep the elbow low, as a person would
    $('opArmU').setAttribute('d', line(opSh, op[0])); $('opArmF').setAttribute('d', line(op[0], op[1]));
    $('opArmC').setAttribute('d', line(op[0], [lerp(op[0][0], op[1][0], .35), lerp(op[0][1], op[1][1], .35)]));
    $('opHand').setAttribute('cx', op[1][0].toFixed(1)); $('opHand').setAttribute('cy', op[1][1].toFixed(1));
    $('dipper').setAttribute('transform', 'translate(' + op[1][0].toFixed(1) + ' ' + op[1][1].toFixed(1) + ')');
    $('dipper').setAttribute('opacity', (t >= 11.8 && t < 12.8) ? 1 : 0);
    $('anBar').setAttribute('width', (46 * seg(t, 12.6, 13.4)).toFixed(1));
    $('anBar').setAttribute('opacity', (t >= 12.6 && t < 13.45) ? 1 : 0);
    $('anTxt').setAttribute('opacity', (t >= 13.4 && t < 21) ? 1 : 0);
    $('anLed').setAttribute('fill', (t >= 12.6 && t < 13.4 && Math.floor(t * 8) % 2) ? '#8EE29B' : '#2E7D32');
    $('paper').setAttribute('height', (26 * seg(t, 14.0, 14.8)).toFixed(1));
    $('paper').setAttribute('y', (334 - 26 * seg(t, 14.0, 14.8)).toFixed(1));

    // monitor
    var on = function (id, a, b) { $(id).setAttribute('opacity', (t >= a && t < (b || 21)) ? 1 : 0); };
    on('mCode', 7.6); on('mLit', 8.6); on('mFat', 13.4); on('mDone', 13.8);
    $('mLit').textContent = 'लिटर ' + litresAt(t).toFixed(2);

    // data to phone
    var dots = $('dots').children, A = [1120, 102], C = [640, 0], B = [130, 250];
    for (var i = 0; i < dots.length; i++) {
      var q = seg(t, 14.2 + i * .12, 14.9 + i * .12), u = 1 - q;
      var x = u * u * A[0] + 2 * u * q * C[0] + q * q * B[0], y = u * u * A[1] + 2 * u * q * C[1] + q * q * B[1];
      dots[i].setAttribute('cx', x.toFixed(1)); dots[i].setAttribute('cy', y.toFixed(1));
      dots[i].setAttribute('opacity', (q > 0 && q < 1) ? 1 : 0);
    }
    $('signal').setAttribute('opacity', (t >= 14.0 && t < 15.0) ? (Math.floor(t * 6) % 2 ? 1 : .4) : 0);

    // phone close-up
    var py = t < 14.8 ? 560 : (t < 18.6 ? lerp(560, 190, ease(seg(t, 14.8, 15.3))) : lerp(190, 560, ease(seg(t, 18.6, 19.1))));
    $('phone').setAttribute('transform', 'translate(40 ' + py.toFixed(1) + ') scale(.88)');
    $('typing').setAttribute('opacity', (t >= 15.3 && t < 16.0) ? 1 : 0);
    var tds = document.querySelectorAll('#typing .td');
    for (var j = 0; j < tds.length; j++) tds[j].setAttribute('opacity', (Math.floor(t * 6) % 3 === j) ? 1 : .35);
    $('msg').setAttribute('opacity', t >= 16.0 ? 1 : 0);
    $('ticks').setAttribute('fill', t >= 16.5 ? '#2196F3' : '#9E9E9E');
    $('pStatus').textContent = (t >= 15.3 && t < 16.0) ? 'टाइप करत आहे…' : 'ऑनलाइन';

    // process panel: current step blue, finished steps green with a tick
    var ends = [7.6, 11.2, 13.8, 16.5], cur = t < 7.6 ? 0 : t < 11.2 ? 1 : t < 13.8 ? 2 : (t < 16.5 ? 3 : 4);
    for (var pi = 0; pi < 4; pi++) {
      var done = pi < cur, act = pi === cur;
      $('procR' + pi).setAttribute('fill', act ? '#1F4E9A' : (done ? '#E8F3E9' : '#F4F7FB'));
      $('procC' + pi).setAttribute('fill', act ? '#FFFFFF' : (done ? '#2E7D32' : '#9AA6B5'));
      $('procN' + pi).setAttribute('fill', act ? '#1F4E9A' : '#FFFFFF');
      $('procN' + pi).setAttribute('opacity', done ? 0 : 1);
      $('procK' + pi).setAttribute('opacity', done ? 1 : 0);
      $('procI' + pi).setAttribute('stroke', act ? '#FFFFFF' : (done ? '#2E7D32' : '#1F4E9A'));
      $('procT' + pi).setAttribute('fill', act ? '#FFFFFF' : (done ? '#1B5E20' : '#1A1A1A'));
    }

    // step buttons
    var stepIdx = t < 7.6 ? 0 : t < 11.4 ? 1 : t < 14.2 ? 2 : 3;
    stepBtns.forEach(function (b, i) { b.classList.toggle('on', i === stepIdx); b.classList.toggle('done', i < stepIdx); });
    scrub.value = t.toFixed(2);
  }

  // ---------- player ----------
  var stepBtns = Array.prototype.slice.call(document.querySelectorAll('.sim-steps button'));
  var scrub = $('scrub'), bPlay = $('bPlay'), speed = 1, t = 0, playing = true, last = null;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setPlaying(p) { playing = p; bPlay.textContent = p ? 'थांबवा' : 'चालू करा'; bPlay.setAttribute('aria-pressed', p ? 'false' : 'true'); last = null; }
  function tick(now) {
    if (playing) { if (last != null) { t += (now - last) / 1000 * speed; if (t > D) t = 0; } last = now; render(t); }
    requestAnimationFrame(tick);
  }
  bPlay.addEventListener('click', function () { setPlaying(!playing); });
  $('bReplay').addEventListener('click', function () { t = 0; render(t); setPlaying(true); });
  $('bSpeed').addEventListener('change', function (e) { speed = parseFloat(e.target.value) || 1; });
  scrub.addEventListener('input', function () { t = parseFloat(scrub.value) || 0; render(t); setPlaying(false); });
  stepBtns.forEach(function (b) { b.addEventListener('click', function () { t = parseFloat(b.getAttribute('data-t')); render(t); setPlaying(true); }); });
  window.__sim = { render: render, pause: function () { setPlaying(false); } };
  if (reduce) { t = 16.6; render(t); setPlaying(false); } else { render(0); }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
